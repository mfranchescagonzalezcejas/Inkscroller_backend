[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inkscroller-backend"
version = "1.0.0"
description = "InkScroller backend API"
requires-python = ">=3.12"

# ── Tool: Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
# Match Ruff's default rule set (E4, E7, E9, F) so the CI behaviour
# does not change for pre-existing code. Adding isort, naming,
# pyupgrade, or ruff-specific rules would surface pre-existing nits
# unrelated to the coverage/type-checking scope of issue #67. Expand
# deliberately in a follow-up if needed.
select = [
    "E4",
    "E7",
    "E9",
    "F",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── Tool: pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

# ── Tool: pytest-cov ────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75

# ── Tool: mypy ──────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
disallow_any_unimported = false
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "app/core/database",
    "app/core/db_adapter",
    "app/services/chapter_service",
    "app/services/chapter_pages_service",
]
# ponytail: narrow error-code suppressions instead of blanket ignore_errors
disallow_untyped_defs = false
disable_error_code = [
    "no-any-return",
    "unused-ignore",
    "arg-type",
    "operator",
]
